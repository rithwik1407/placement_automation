name: Placement alerts

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:
    inputs:
      test:
        description: "Only send a test message"
        type: boolean
        default: false
      resend_days:
        description: "Re-send alerts for placement emails from the last N days (0 = normal run)"
        type: number
        default: 0

concurrency:
  group: placement-poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    # The schedule does nothing until the repository variable ALERTS_ENABLED is set to true.
    if: ${{ vars.ALERTS_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///state/placement_agent.db
      STORE_EMAIL_DETAILS: "false"      # the state cache only keeps message IDs and statuses
      CLASSIFIER: ${{ vars.CLASSIFIER || 'rules' }}
      NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || 'callmebot' }}
      GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Send test message
        if: ${{ inputs.test }}
        run: python scripts/poll_once.py --test

      - name: Restore state (which emails were already alerted)
        if: ${{ !inputs.test }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: placement-state-${{ github.run_id }}
          restore-keys: placement-state-

      - name: Check Gmail and send alerts
        if: ${{ !inputs.test }}
        run: mkdir -p state && python scripts/poll_once.py --resend-days ${{ inputs.resend_days || 0 }}

      - name: Save state
        if: ${{ always() && !inputs.test }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: placement-state-${{ github.run_id }}-${{ github.run_attempt }}
